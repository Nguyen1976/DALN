name: Deploy Backend

on:
  push:
    branches:
      - main
      - deploy-on-aws
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag deploy lên EC2 (để trống = sha git)"
        required: false
        default: ""

env:
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-1.amazonaws.com

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      # - run: npm test   # bật khi đã có test

  build-and-push:
    name: Build & Push — ${{ matrix.service }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - user
          - chat
          - notification
          - realtime-gateway
          - recommendation
          - saga-orchestrator
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-chat-app-deploy
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        working-directory: backend
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/chat-app/${{ matrix.service }}:${{ steps.meta.outputs.tag }}
        run: |
          docker build \
            --target production \
            --build-arg SERVICE=${{ matrix.service }} \
            -t "$IMAGE" \
            -t "${{ env.ECR_REGISTRY }}/chat-app/${{ matrix.service }}:latest" \
            .
          docker push "$IMAGE"
          docker push "${{ env.ECR_REGISTRY }}/chat-app/${{ matrix.service }}:latest"

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-chat-app-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Chat App backend $IMAGE_TAG" \
            --parameters commands="[
              \"set -euo pipefail\",
              \"cd /opt/chat-app/backend\",
              \"aws ssm get-parameter --name /chat-app/prod/env --with-decryption --region $AWS_REGION --query Parameter.Value --output text > .env.production\",
              \"export ECR_REGISTRY=$ECR_REGISTRY\",
              \"export IMAGE_TAG=$IMAGE_TAG\",
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY\",
              \"docker compose -f docker-compose.prod.yml down\",
              \"docker compose -f docker-compose.prod.yml --env-file .env.production pull\",
              \"docker compose -f docker-compose.prod.yml --env-file .env.production up -d --remove-orphans\",
              \"docker image prune -a -f\",

            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM CommandId: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "[Status, StandardOutputContent, StandardErrorContent]"
