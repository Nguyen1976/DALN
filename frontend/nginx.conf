server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Image build tái lập (CI: SOURCE_DATE_EPOCH=0 + rewrite-timestamp) nên mọi file
  # có mtime 1970, và ETag/Last-Modified của nginx chỉ còn phụ thuộc kích thước.
  # index.html của hai bản build khác nhau thường cùng kích thước -> trình duyệt
  # nhận 304, giữ bản cũ trỏ tới JS đã xoá -> trang trắng. Tắt hẳn hai validator
  # này: file trong /assets có hash nên không cần, file còn lại nhỏ.
  etag off;
  if_modified_since off;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Tên file trong /assets có hash nội dung -> cache vĩnh viễn.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html luôn lấy bản mới để trình duyệt thấy ngay bundle vừa deploy.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA (createBrowserRouter): /chat/:id, /friends... đều trả về index.html.
  # File tĩnh không có hash (favicon, ảnh trong public/): Last-Modified 1970 làm
  # trình duyệt tự cache gần như vĩnh viễn nếu không có Cache-Control.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
