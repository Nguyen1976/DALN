server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Tên file trong /assets có hash nội dung -> cache vĩnh viễn.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html luôn lấy bản mới để trình duyệt thấy ngay bundle vừa deploy.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA (createBrowserRouter): /chat/:id, /friends... đều trả về index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
