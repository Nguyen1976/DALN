# ============================================================================
# coturn — máy chủ TURN cho gọi thoại 1-1 (bản thiết kế:
# docs/diagrams/voice-call-turn.html). Chạy TRÊN HOST prod (apt), cạnh nginx.
#
# ĐÂY LÀ TEMPLATE, KHÔNG phải file coturn đọc trực tiếp: coturn không tự đọc biến
# môi trường. deploy/deploy.sh render file này thành /etc/turnserver.conf, thay
# ${TURN_SECRET}, ${TURN_REALM}, ${TURN_HOST} bằng giá trị trong
# backend/.env.production (envsubst). Sửa cấu hình thì sửa file này trong repo rồi
# deploy lại — đừng sửa thẳng /etc/turnserver.conf (deploy sau sẽ ghi đè).
#
# TURN_SECRET phải TRÙNG với giá trị trong backend/.env.production: gateway ký mật
# khẩu ngắn hạn bằng nó (call.ice_config), coturn tự kiểm lại bằng chính nó nhờ
# use-auth-secret — hai bên không cần gọi nhau qua mạng, secret không xuống trình
# duyệt. Đổi secret thì đổi cả hai chỗ cùng lúc; mật khẩu cũ tự hết hạn trong 1 giờ.
# ============================================================================

# --- Xác thực: mật khẩu ngắn hạn do gateway ký (giao thức REST của coturn) ---
# Không có danh sách user; coturn tính lại base64(HMAC-SHA1(secret, username)) để
# kiểm, username là "<hạn unix>:<userId>".
use-auth-secret
static-auth-secret=${TURN_SECRET}
realm=${TURN_REALM}

# --- Cổng nghe ---
listening-port=3478
tls-listening-port=5349

# --- Địa chỉ công khai gắn vào candidate relay ---
# Server một IP: bỏ listening-ip (nghe mọi giao diện) là đủ; external-ip cho coturn
# biết IP công khai để quảng bá cho trình duyệt.
external-ip=${TURN_HOST}

# --- Dải cổng relay: mỗi phiên TURN giữ một cổng (khớp ufw 49152:49999/udp) ---
min-port=49152
max-port=49999

# --- Chứng chỉ TLS cho turns:5349 (dùng chung Let's Encrypt với nginx) ---
# certbot deploy-hook restart coturn khi gia hạn (xem deploy/README.md).
cert=/etc/letsencrypt/live/nguyen1976.xyz/fullchain.pem
pkey=/etc/letsencrypt/live/nguyen1976.xyz/privkey.pem

# --- Bảo mật / chống lạm dụng ---
fingerprint
no-cli
# Chỉ relay UDP ra peer (WebRTC không cần relay TCP tới peer). turn:...transport=tcp
# và turns: là kết nối CLIENT tới coturn nên vẫn chạy.
no-tcp-relay
no-multicast-peers

# Chặn TURN thành cửa vào mạng nội bộ / localhost (SSRF). coturn nhận dạng range
# "IP1-IP2". Cho relay ra Internet, chặn dải riêng tư:
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=::1
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# --- Hạn mức (một mật khẩu ký không ngốn hết băng thông/cổng) ---
# user-quota: phiên đồng thời cho một "user" (một credential); total-quota: tổng.
user-quota=12
total-quota=1200

# --- Log: ra syslog -> journald (journalctl -u coturn) / /var/log/syslog ---
syslog
