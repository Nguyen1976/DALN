# ============================================================================
# coturn cho DEV — chỉ để QC thử đường relay (ép iceTransportPolicy:'relay' và
# thấy âm thanh đi qua coturn). Mount vào service `coturn` trong
# backend/docker-compose.yml. Production KHÔNG dùng file này: xem
# deploy/coturn/turnserver.conf (cài apt trên host qua deploy/deploy.sh).
#
# static-auth-secret dưới đây phải KHỚP TURN_SECRET trong backend/.env.docker.
# ============================================================================

use-auth-secret
static-auth-secret=dev-turn-secret-doi-o-production
realm=daln.local

listening-port=3478

# Dải relay NHỎ cho dev (khớp cổng publish trong docker-compose.yml: đỡ tạo hàng
# trăm userland proxy trên Docker Desktop).
min-port=49160
max-port=49200

# Docker Desktop chuyển cổng publish qua 127.0.0.1 -> quảng bá localhost để trình
# duyệt trên host tới được candidate relay.
external-ip=127.0.0.1

# Dev không có chứng chỉ -> tắt TLS/DTLS (chỉ turn: udp/tcp, không turns:).
no-tls
no-dtls

fingerprint
no-cli
verbose

# KHÔNG chặn dải nội bộ ở dev: trình duyệt trên host xuất hiện dưới IP docker/LAN
# (172.x / 192.168.x), chặn thì relay dev không chạy. Production chặn các dải này
# trong deploy/coturn/turnserver.conf.
