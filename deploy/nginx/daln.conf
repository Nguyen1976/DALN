# nginx trên HOST (không phải container) phục vụ https://nguyen1976.xyz.
# deploy/deploy.sh cài file này vào /etc/nginx/sites-available/daln.conf ở mỗi lần
# deploy rồi nạp lại. Chứng chỉ Let's Encrypt (certbot), gia hạn qua webroot
# /var/www/certbot — xem deploy/README.md, mục HTTPS.
#
#   /             -> web (container, 127.0.0.1:8081)
#   /api/         -> Kong (127.0.0.1:8000), bỏ tiền tố: /api/user/me -> /user/me
#   /socket.io/   -> Kong (websocket; namespace /realtime nằm trong handshake)
#   /daln-media/  -> MinIO (127.0.0.1:9000), giữ nguyên Host vì URL presigned ký theo host
#
# API không đặt ở gốc (/user, /chat...): /chat/:id là route của SPA.
# nginx 1.24 (Ubuntu 24.04) chưa có `http2 on;` -> dùng `listen ... http2`.
#
# Domain đi qua proxy Cloudflare (đám mây cam), SSL mode Full (strict).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# IP thật của người dùng khi đi qua Cloudflare: kết nối tới từ dải IP Cloudflare
# thì $remote_addr lấy từ header CF-Connecting-IP. Thiếu đoạn này, phiên đăng nhập
# ghi IP/vị trí của Cloudflare và rate limit gộp mọi người chung một IP. Chỉ tin
# header khi kết nối thật sự từ Cloudflare, nên người ngoài không giả được.
# Truy cập thẳng IP server (đám mây xám) không bị ảnh hưởng.
# Dải IP: https://www.cloudflare.com/ips-v4 và /ips-v6 (lấy ngày 2026-09-27).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# HTTP: chỉ phục vụ ACME challenge, còn lại chuyển sang https://nguyen1976.xyz
# (kể cả truy cập bằng IP).
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://nguyen1976.xyz$request_uri;
  }
}

# www -> apex
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.nguyen1976.xyz;

  ssl_certificate     /etc/letsencrypt/live/nguyen1976.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/nguyen1976.xyz/privkey.pem;

  # Cloudflare có thể đẩy challenge của certbot sang https trước khi tới đây.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://nguyen1976.xyz$request_uri;
  }
}

server {
  listen 443 ssl http2 default_server;
  listen [::]:443 ssl http2 default_server;
  server_name nguyen1976.xyz;

  ssl_certificate     /etc/letsencrypt/live/nguyen1976.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/nguyen1976.xyz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # Upload bằng URL presigned (PUT /daln-media/...): mặc định nginx chỉ nhận 1 MB.
  client_max_body_size 100m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  # Ghi đè, không nối thêm: giá trị X-Forwarded-For do client tự gửi không lọt vào
  # Kong/service. $remote_addr đã là IP thật (xem real_ip ở trên).
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:8000/;
  }

  location /socket.io/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # LiveKit (SFU) — WebSocket tín hiệu gọi nhóm audio. Chỉ đường WS đi qua nginx;
  # media (UDP 50000-50199, TCP 7881) tới thẳng IP server, không qua đây.
  # Trailing slash ở proxy_pass BỎ tiền tố: /livekit/rtc -> /rtc. Header Upgrade/
  # Connection + proxy_http_version 1.1 kế thừa từ cấp server ở trên.
  location /livekit/ {
    proxy_pass http://127.0.0.1:7880/;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location /daln-media/ {
    proxy_pass http://127.0.0.1:9000;
    proxy_request_buffering off;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://127.0.0.1:8081;
  }
}
