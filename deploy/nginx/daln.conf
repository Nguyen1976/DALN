# nginx trên HOST (không phải container) phục vụ https://nguyen1976.xyz.
# deploy/deploy.sh cài file này vào /etc/nginx/sites-available/daln.conf ở mỗi lần
# deploy rồi nạp lại. Chứng chỉ Let's Encrypt (certbot), gia hạn qua webroot
# /var/www/certbot — xem deploy/README.md, mục HTTPS.
#
#   /             -> web (container, 127.0.0.1:8081)
#   /api/         -> Kong (127.0.0.1:8000), bỏ tiền tố: /api/user/me -> /user/me
#   /socket.io/   -> Kong (websocket; namespace /realtime nằm trong handshake)
#   /daln-media/  -> MinIO (127.0.0.1:9000), giữ nguyên Host vì URL presigned ký theo host
#
# API không đặt ở gốc (/user, /chat...): /chat/:id là route của SPA.
# nginx 1.24 (Ubuntu 24.04) chưa có `http2 on;` -> dùng `listen ... http2`.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# HTTP: chỉ phục vụ ACME challenge, còn lại chuyển sang https://nguyen1976.xyz
# (kể cả truy cập bằng IP).
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://nguyen1976.xyz$request_uri;
  }
}

# www -> apex
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.nguyen1976.xyz;

  ssl_certificate     /etc/letsencrypt/live/nguyen1976.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/nguyen1976.xyz/privkey.pem;

  return 301 https://nguyen1976.xyz$request_uri;
}

server {
  listen 443 ssl http2 default_server;
  listen [::]:443 ssl http2 default_server;
  server_name nguyen1976.xyz;

  ssl_certificate     /etc/letsencrypt/live/nguyen1976.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/nguyen1976.xyz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # Upload bằng URL presigned (PUT /daln-media/...): mặc định nginx chỉ nhận 1 MB.
  client_max_body_size 100m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  location /api/ {
    proxy_pass http://127.0.0.1:8000/;
  }

  location /socket.io/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # LiveKit (SFU) — WebSocket tín hiệu gọi nhóm audio. Chỉ đường WS đi qua nginx;
  # media (UDP 50000-50199, TCP 7881) tới thẳng IP server, không qua đây.
  # Trailing slash ở proxy_pass BỎ tiền tố: /livekit/rtc -> /rtc. Header Upgrade/
  # Connection + proxy_http_version 1.1 kế thừa từ cấp server ở trên.
  location /livekit/ {
    proxy_pass http://127.0.0.1:7880/;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location /daln-media/ {
    proxy_pass http://127.0.0.1:9000;
    proxy_request_buffering off;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://127.0.0.1:8081;
  }
}
