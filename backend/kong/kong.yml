_format_version: '3.0'
_transform: true

services:
  - name: user-http
    url: http://user:3002
    routes:
      - name: user-route
        paths:
          - /user
        strip_path: false
        preserve_host: true
        plugins:
          - name: rate-limiting
            config:
              minute: 200
              policy: local
              limit_by: ip
              fault_tolerant: true
              hide_client_headers: false

  - name: chat-http
    url: http://chat:3003
    routes:
      - name: chat-route
        paths:
          - /chat
        strip_path: false
        preserve_host: true
        plugins:
          - name: rate-limiting
            config:
              minute: 200
              policy: local
              limit_by: ip
              fault_tolerant: true
              hide_client_headers: false

  - name: notification-http
    url: http://notification:3004
    routes:
      - name: notification-route
        paths:
          - /notification
        strip_path: false
        preserve_host: true
        plugins:
          - name: rate-limiting
            config:
              minute: 200
              policy: local
              limit_by: ip
              fault_tolerant: true
              hide_client_headers: false

  - name: recommendation-http
    url: http://recommendation:3005
    routes:
      - name: recommendation-route
        paths:
          - /recommendation
        strip_path: false
        preserve_host: true
        plugins:
          - name: rate-limiting
            config:
              minute: 200
              policy: local
              limit_by: ip
              fault_tolerant: true
              hide_client_headers: false

  - name: realtime-http
    url: http://realtime-gateway:3001
    routes:
      - name: realtime-route
        paths:
          - /realtime
          - /socket.io
        strip_path: false
        preserve_host: true

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:5173
        - http://127.0.0.1:5173
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - Origin
        - X-Requested-With
      exposed_headers:
        - Set-Cookie
      credentials: true
      max_age: 3600
