# ============================================================================
# Docker Compose — DEV: app services + LOCAL infra containers.
#
#   docker compose up -d              -> dev full stack (hot-reload + mongo/redis/...)
#   docker compose --profile training up -d neo4j   -> chỉ bật Neo4j khi train offline
#
# PRODUCTION (managed cloud — không chạy container stateful):
#   cp .env.production.example .env.production
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
#   docker compose down         -> dừng container (volume dev vẫn còn)
#   docker compose down -v      -> xoá luôn dữ liệu local
#
# One-shot trước app (giống prod):
#   mongo-init -> db-push -> migrate -> app -> migrate-background (app không chờ)
#   rabbitmq -> rabbitmq-init -> app
# DB dev có thể có dữ liệu trùng: các bước này lỗi CHỈ in cảnh báo rồi thoát 0
# -> app vẫn khởi động, dev không bao giờ bị chặn. Chạy tay:
#   docker compose run --rm migrate bash docker/migrate.sh status
# ============================================================================

name: daln-backend

# ---- Cấu hình dùng chung cho 5 app service (NestJS) ----
# LƯU Ý: chỉ service `user` có khối `build` để build image 1 lần.
# 4 service còn lại chỉ `image:` dùng lại -> tránh 5 build song song
# cùng export 1 tag gây lỗi "image already exists".
x-app-common: &app-common
  image: daln-backend-dev:latest # 1 image dev dùng chung cho mọi service
  restart: unless-stopped
  env_file:
    - .env          # secrets có sẵn (SMTP, DATABASE_URL nếu bạn điền)
    - .env.docker   # cấu hình kết nối infra (ghi đè .env) - bắt buộc
  volumes:
    - ./:/app # mount source để hot-reload
    - /app/node_modules # giữ node_modules của container (linux)
  networks:
    - backend
  depends_on:
    # migrate chờ db-push, db-push chờ mongo-init (xem x-dev-oneshot).
    migrate:
      condition: service_completed_successfully
    rabbitmq-init:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    qdrant:
      condition: service_started

# ---- One-shot schema/migration cho DEV: db-push, migrate, migrate-background ----
# Cùng image + volume với app: node_modules (linux) của image dev có sẵn prisma,
# ts-node, tsconfig-paths. Entrypoint chạy `command`; lỗi thì in cảnh báo to rồi
# vẫn thoát 0 -> app chờ bằng service_completed_successfully mà không bao giờ bị
# chặn (DB dev có dữ liệu trùng thì unique index không tạo được, v.v.).
x-dev-oneshot: &dev-oneshot
  image: daln-backend-dev:latest
  restart: "no"
  environment:
    MONGO_HOST: mongo:27017
    MONGO_REPLICA_SET: rs0
  volumes:
    - ./:/app
    - /app/node_modules
  networks:
    - backend
  entrypoint:
    - sh
    - -c
    - >-
      "$$@" ||
      echo "[dev] ===== CẢNH BÁO: '$$*' LỖI (xem log phía trên). App vẫn khởi động nhưng schema/dữ liệu có thể chưa đúng. =====" >&2
    - dev-oneshot

services:
  # ==========================================================================
  # INFRASTRUCTURE
  # ==========================================================================
  mongo:
    image: mongo:7
    container_name: daln-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Khởi tạo replica set (Prisma MongoDB bắt buộc). Chạy 1 lần rồi thoát.
  mongo-init:
    image: mongo:7
    container_name: daln-mongo-init
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - backend
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval "
          try {
            rs.status();
            print('Replica set already initialized');
          } catch (e) {
            rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] });
            print('Replica set initialized');
          }
          // db-push chạy ngay sau bước này: chưa bầu xong primary thì nó lỗi
          // ReplicaSetNoPrimary -> chờ tới khi ghi được (dev: không chặn nếu quá hạn).
          for (let i = 0; i < 60 && !db.hello().isWritablePrimary; i++) sleep(500);
          print(db.hello().isWritablePrimary ? 'Replica set ready' : 'CẢNH BÁO: replica set chưa có primary');
        "

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: daln-rabbitmq
    restart: unless-stopped
    environment: &rabbitmq-credentials
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: user
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Dead-letter (docker/rabbitmq-init.sh) — giống prod. Lỗi chỉ cảnh báo: dev không
  # bị chặn, nhưng khi đó message bị nack sẽ mất thay vì nằm ở daln.dead-letters.
  rabbitmq-init:
    image: curlimages/curl:8.22.0
    container_name: daln-rabbitmq-init
    restart: "no"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment: *rabbitmq-credentials
    volumes:
      - ./docker/rabbitmq-init.sh:/rabbitmq-init.sh:ro
    networks:
      - backend
    entrypoint:
      - sh
      - -c
      - >-
        sh /rabbitmq-init.sh ||
        echo "[dev] ===== CẢNH BÁO: rabbitmq-init LỖI (xem log phía trên). Chưa có dead-letter: message bị nack sẽ mất. =====" >&2

  redis:
    image: redis:7-alpine
    container_name: daln-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # 6380 trên host để không đụng Redis của dự án khác đang giữ 6379.
      # Trong Docker network các service vẫn nối qua `redis:6379` như cũ.
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    profiles: [training]
    image: neo4j:5-community
    container_name: daln-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
    ports:
      - "7474:7474" # HTTP / Browser UI
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password123 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: daln-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - backend

  # Kho đối tượng cho DEV: tệp đính kèm không đi ra AWS.
  # Console: http://localhost:9001 (minioadmin/minioadmin) — API: :9000
  minio:
    image: minio/minio:latest
    container_name: daln-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Tạo bucket và mở quyền đọc công khai (ảnh trong chat được tải thẳng).
  minio-init:
    image: minio/mc:latest
    container_name: daln-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - backend
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/daln-media &&
        mc anonymous set download local/daln-media &&
        echo "bucket daln-media san sang"

  # Mail catcher cho DEV: mọi email (OTP, mời kết bạn, digest) bị giữ lại ở đây,
  # không gửi ra Internet. UI: http://localhost:8025 — API: http://localhost:8025/api/v2/messages
  mailhog:
    image: mailhog/mailhog:latest
    platform: linux/amd64
    container_name: daln-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI + API
    networks:
      - backend

  # coturn cho DEV — máy chủ TURN để QC thử đường relay (ép iceTransportPolicy:
  # 'relay' và thấy âm thanh đi qua coturn). Trình duyệt trên host gọi tới
  # localhost:3478 (TURN_HOST=localhost trong .env.docker); static-auth-secret
  # trong turnserver.dev.conf phải KHỚP TURN_SECRET ở .env.docker.
  # Production KHÔNG chạy coturn trong Docker: cài apt trên host (deploy/deploy.sh).
  coturn:
    image: coturn/coturn:4.6
    container_name: daln-coturn
    restart: unless-stopped
    # CMD mặc định của image thêm `--external-ip=$(detect-external-ip)`, trùng với
    # external-ip=127.0.0.1 trong file config -> coturn báo lỗi "defined more than
    # once". Ghi đè command để chỉ đọc config: relay quảng bá 127.0.0.1 nên trình
    # duyệt trên host tới được cổng relay đã publish.
    command: ["-c", "/etc/coturn/turnserver.conf", "--log-file=stdout"]
    volumes:
      # Config nằm ở deploy/ (dùng chung repo); compose ở backend/ nên đi ../.
      - ../deploy/coturn/turnserver.dev.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      # Dải relay nhỏ (khớp min-port/max-port trong turnserver.dev.conf).
      - "49160-49200:49160-49200/udp"
    networks:
      - backend

  # LiveKit (SFU) cho DEV — máy chủ gọi NHÓM audio (bản thiết kế:
  # docs/diagrams/group-call-sfu-flow.html). Gateway ký token (livekit-server-sdk),
  # trình duyệt trên host connect ws://localhost:7880 rồi publish/subscribe audio.
  # Config + keys ở deploy/livekit/livekit.dev.yaml; secret trong đó phải KHỚP
  # LIVEKIT_API_SECRET ở .env.docker. Production chạy livekit TRONG compose luôn:
  # xem docker-compose.prod.yml.
  livekit:
    image: livekit/livekit-server:v1.7
    container_name: daln-livekit
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      # Config nằm ở deploy/ (dùng chung repo); compose ở backend/ nên đi ../.
      - ../deploy/livekit/livekit.dev.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"   # WebSocket + HTTP API (client connect)
      - "7881:7881"   # RTC qua TCP (dự phòng khi UDP bị chặn)
      # Dải cổng UDP cho media (khớp port_range trong livekit.dev.yaml).
      - "50000-50019:50000-50019/udp"
    networks:
      - backend

  kong:
    image: kong:3.7
    container_name: daln-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      # 8080 trên host để không đụng dự án khác đang giữ 8000.
      # Bên trong container Kong vẫn nghe 8000 như cấu hình mặc định.
      - "8080:8000" # proxy (client gọi qua đây -> VITE_API_ROOT)
      - "8001:8001" # admin API
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    networks:
      - backend
    depends_on:
      - user
      - chat
      - notification
      - realtime-gateway
      - recommendation

  # ==========================================================================
  # SCHEMA + MIGRATION (one-shot, xem x-dev-oneshot) — lỗi không chặn app
  # ==========================================================================
  # Đồng bộ collection + unique index (docker/db-push.sh).
  db-push:
    <<: *dev-oneshot
    container_name: daln-db-push
    command: ["bash", "docker/db-push.sh"]
    depends_on:
      mongo-init:
        condition: service_completed_successfully

  # Migration dữ liệu (libs/migrations, file ở migrations/<service>/).
  migrate:
    <<: *dev-oneshot
    container_name: daln-migrate
    command: ["bash", "docker/migrate.sh", "up"]
    depends_on:
      db-push:
        condition: service_completed_successfully

  # Backfill dài, chạy tiếp được từ chỗ dừng — app không chờ.
  migrate-background:
    <<: *dev-oneshot
    container_name: daln-migrate-background
    command: ["bash", "docker/migrate.sh", "background"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # ==========================================================================
  # APP SERVICES (NestJS) - cùng 1 image dev, khác nhau ở biến SERVICE + PORT
  # ==========================================================================
  user:
    <<: *app-common
    container_name: daln-user
    # Chỉ service này build image; các service khác dùng lại image đã build.
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    environment:
      SERVICE: user
      PORT: 3002
      DATABASE_URL: mongodb://mongo:27017/user-service?replicaSet=rs0
    ports:
      - "3002:3002"

  chat:
    <<: *app-common
    container_name: daln-chat
    environment:
      SERVICE: chat
      PORT: 3003
      DATABASE_URL: mongodb://mongo:27017/chat-service?replicaSet=rs0
    ports:
      - "3003:3003"

  notification:
    <<: *app-common
    container_name: daln-notification
    environment:
      SERVICE: notification
      PORT: 3004
      DATABASE_URL: mongodb://mongo:27017/notification-service?replicaSet=rs0
    ports:
      - "3004:3004"

  realtime-gateway:
    <<: *app-common
    container_name: daln-realtime
    environment:
      SERVICE: realtime-gateway
      # realtime-gateway đọc cả `port` (thường) lẫn PORT - set cả 2 cho chắc
      port: 3001
      PORT: 3001
    ports:
      - "3001:3001"

  recommendation:
    <<: *app-common
    container_name: daln-recommendation
    environment:
      SERVICE: recommendation
      PORT: 3005
      DATABASE_URL: mongodb://mongo:27017/recommendation-service?replicaSet=rs0
      USER_MONGO_URI: mongodb://mongo:27017/user-service?replicaSet=rs0
      RECOMMENDATION_ROLE: api
    ports:
      - "3005:3005"

  # Cùng image, cùng app — chỉ khác RECOMMENDATION_ROLE.
  # Gánh toàn bộ việc nặng CPU (huấn luyện mô hình, cron gợi ý hằng ngày) để
  # tiến trình `recommendation` ở trên luôn rảnh tay phục vụ HTTP.
  recommendation-worker:
    <<: *app-common
    container_name: daln-recommendation-worker
    environment:
      SERVICE: recommendation
      PORT: 3105
      DATABASE_URL: mongodb://mongo:27017/recommendation-service?replicaSet=rs0
      USER_MONGO_URI: mongodb://mongo:27017/user-service?replicaSet=rs0
      RECOMMENDATION_ROLE: worker

  # Saga orchestrator: RMQ-only (không expose HTTP), điều phối luồng accept friend.
  saga-orchestrator:
    <<: *app-common
    container_name: daln-saga-orchestrator
    environment:
      SERVICE: saga-orchestrator
      DATABASE_URL: mongodb://mongo:27017/saga-orchestrator-service?replicaSet=rs0

networks:
  backend:
    driver: bridge

volumes:
  minio_data:
  mongo_data:
  rabbitmq_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
