<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DALN · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · DALN</p>
    <h1>One gateway in, one event bus between services</h1>

    <svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="daln-architecture-title daln-architecture-desc">
      <title id="daln-architecture-title">DALN system architecture</title>
      <desc id="daln-architecture-desc">Architecture diagram showing the React client reaching five NestJS services through the Kong gateway, all six services exchanging events over RabbitMQ, and each service owning its own data stores.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <!-- Two-way event link: the start marker flips to point back into the service. -->
        <marker id="arrow-bi" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zone: NestJS services (drawn before arrows and nodes) -->
      <rect x="400" y="48" width="240" height="464" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="472" y="52" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="520" y="61" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">NESTJS SERVICES</text>

      <!-- ============ ARROWS (behind nodes) ============ -->
      <!-- Client -> Kong -->
      <line x1="168" y1="252" x2="232" y2="252" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- Kong -> HTTP services + realtime (one attach point per service) -->
      <line x1="344" y1="108" x2="416" y2="108" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="344" y1="180" x2="416" y2="180" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="344" y1="252" x2="416" y2="252" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="344" y1="324" x2="416" y2="324" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="344" y1="396" x2="416" y2="396" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- Services <-> RabbitMQ. Two-way where the service both publishes and consumes. -->
      <line x1="624" y1="108" x2="704" y2="108" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#arrow-bi)" marker-end="url(#arrow-bi)"/>
      <line x1="624" y1="180" x2="704" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#arrow-bi)" marker-end="url(#arrow-bi)"/>
      <line x1="704" y1="252" x2="624" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="704" y1="324" x2="624" y2="324" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="624" y1="396" x2="704" y2="396" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#arrow-bi)" marker-end="url(#arrow-bi)"/>
      <line x1="624" y1="468" x2="704" y2="468" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#arrow-bi)" marker-end="url(#arrow-bi)"/>

      <!-- Arrow labels (masked, 8px above the stroke) -->
      <rect x="172" y="232" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="200" y="241" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REST · WS</text>

      <rect x="352" y="376" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="380" y="385" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEBSOCKET</text>

      <!-- ============ NODES ============ -->
      <!-- Web client (input) -->
      <rect x="40" y="220" width="128" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="220" width="128" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="228" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="62" y="237" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SPA</text>
      <text x="104" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Web client</text>
      <text x="104" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">React 19 · Vite</text>

      <!-- Kong (edge) -->
      <rect x="232" y="80" width="112" height="344" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="80" width="112" height="344" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="240" y="88" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="256" y="97" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EDGE</text>
      <text x="288" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kong</text>
      <text x="288" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">API gateway</text>
      <text x="288" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">:8000</text>
      <text x="288" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CORS · rate limit</text>

      <!-- User service -->
      <rect x="416" y="80" width="208" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="416" y="80" width="208" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="424" y="88" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="438" y="97" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="520" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">User service</text>
      <text x="520" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MongoDB · MinIO</text>

      <!-- Chat service (focal) -->
      <rect x="416" y="152" width="208" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="416" y="152" width="208" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="424" y="160" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="438" y="169" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="520" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chat service</text>
      <text x="520" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MongoDB · Redis · MinIO</text>

      <!-- Notification service -->
      <rect x="416" y="224" width="208" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="416" y="224" width="208" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="424" y="232" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="438" y="241" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="520" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Notification service</text>
      <text x="520" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MongoDB · SMTP</text>

      <!-- Recommendation service -->
      <rect x="416" y="296" width="208" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="416" y="296" width="208" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="424" y="304" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="438" y="313" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="520" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Recommendation</text>
      <text x="520" y="340" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MongoDB · Qdrant · BullMQ</text>

      <!-- Realtime gateway -->
      <rect x="416" y="368" width="208" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="416" y="368" width="208" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="424" y="376" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="438" y="385" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WS</text>
      <text x="520" y="396" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Realtime gateway</text>
      <text x="520" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Socket.IO · Redis presence</text>

      <!-- Saga orchestrator -->
      <rect x="416" y="440" width="208" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="416" y="440" width="208" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="424" y="448" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="440" y="457" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SAGA</text>
      <text x="520" y="468" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Saga orchestrator</text>
      <text x="520" y="484" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MongoDB · saga state</text>

      <!-- RabbitMQ (focal) -->
      <rect x="704" y="80" width="176" height="416" rx="6" fill="#f5f5f5"/>
      <rect x="704" y="80" width="176" height="416" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="712" y="88" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="726" y="97" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BUS</text>
      <text x="792" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RabbitMQ</text>
      <text x="792" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">topic exchanges</text>
      <text x="792" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">outbox · inbox · saga</text>

      <!-- Editorial aside -->
      <text x="880" y="540" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">Outbox on the way in, inbox on the way out:</text>
      <text x="880" y="560" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">a redelivered event is applied only once.</text>

      <!-- ============ LEGEND ============ -->
      <line x1="40" y1="584" x2="920" y2="584" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="600" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="612" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="620" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal</text>

      <rect x="116" y="612" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="136" y="620" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">NestJS service</text>

      <rect x="236" y="612" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="256" y="620" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Gateway</text>

      <rect x="324" y="612" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="344" y="620" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Client</text>

      <line x1="408" y1="617" x2="436" y2="617" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="444" y="620" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP / WebSocket</text>

      <line x1="560" y1="617" x2="588" y2="617" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="596" y="620" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Event consumed</text>

      <line x1="696" y1="617" x2="724" y2="617" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#arrow-bi)" marker-end="url(#arrow-bi)"/>
      <text x="732" y="620" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Event published and consumed</text>
    </svg>
  </div>
</body>
</html>
