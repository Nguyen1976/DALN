<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vòng đời token đặt lại mật khẩu — DALN</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142;
      --color-muted: #4f5d75; --color-accent: #eb6c36;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · DALN</p>
    <h1>Token đặt lại mật khẩu — một lối ra đổi được mật khẩu</h1>

    <svg viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fp-state-title fp-state-desc">
      <title id="fp-state-title">Vòng đời token đặt lại mật khẩu</title>
      <desc id="fp-state-desc">State machine cho token đặt lại mật khẩu trong Redis: một yêu cầu hợp lệ sinh token ở trạng thái đang hoạt động với TTL 900 giây, một yêu cầu bị chặn không sinh token nào; token đang hoạt động có thể bị đọc để kiểm tra mà không tiêu thụ, chuyển sang hết hiệu lực khi quá hạn hoặc bị token mới thay thế, hoặc chuyển sang đã tiêu thụ khi mật khẩu được đổi thành công.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===================== TRANSITIONS (vẽ trước boxes) ===================== -->

      <!-- T1: start -> đang hoạt động -->
      <line x1="380" y1="146" x2="380" y2="240" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="392" y="168" width="228" height="32" rx="2" fill="#f5f5f5"/>
      <text x="400" y="180" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">POST /forgot-password [hợp lệ]</text>
      <text x="400" y="194" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">/ SET pwdreset:&lt;sha256&gt; EX 900</text>

      <!-- T2: start -> không được cấp -->
      <path d="M 386 140 H 932 Q 940 140 940 148 V 240" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="520" y="100" width="216" height="32" rx="2" fill="#f5f5f5"/>
      <text x="528" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">POST /forgot-password [bị chặn]</text>
      <text x="528" y="126" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">/ 204, không sinh token</text>

      <!-- T3: self-loop kiểm tra token -->
      <path d="M 260 262 H 208 Q 200 262 200 270 V 294 Q 200 302 208 302 H 260" fill="none" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
      <rect x="64" y="262" width="124" height="32" rx="2" fill="#f5f5f5"/>
      <text x="184" y="274" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">GET validate</text>
      <text x="184" y="288" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">/ không tiêu thụ</text>

      <!-- T4: đang hoạt động -> đã tiêu thụ (coral, lối ra duy nhất đổi được mật khẩu) -->
      <path d="M 420 324 V 392 Q 420 400 428 400 H 692 Q 700 400 700 408 V 440" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="484" y="372" width="152" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560" y="381" fill="#eb6c36" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">POST /reset-password / GETDEL</text>

      <!-- T5: đang hoạt động -> hết hiệu lực -->
      <path d="M 340 324 V 392 Q 340 400 332 400 H 288 Q 280 400 280 408 V 440" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="120" y="402" width="148" height="32" rx="2" fill="#f5f5f5"/>
      <text x="264" y="414" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">hết 900 giây, hoặc</text>
      <text x="264" y="428" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">bị token mới thay thế</text>

      <!-- T6: đã tiêu thụ -> kết thúc -->
      <line x1="700" y1="524" x2="700" y2="580" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="712" y="534" width="136" height="32" rx="2" fill="#f5f5f5"/>
      <text x="720" y="546" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">publish</text>
      <text x="720" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">user.passwordChanged</text>

      <!-- T7: không được cấp -> kết thúc -->
      <line x1="940" y1="324" x2="940" y2="372" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="952" y="342" width="148" height="12" rx="2" fill="#f5f5f5"/>
      <text x="956" y="351" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">không token nào tồn tại</text>

      <!-- ===================== NODES ===================== -->

      <!-- start -->
      <circle cx="380" cy="140" r="6" fill="#2d3142"/>

      <!-- Đang hoạt động -->
      <rect x="260" y="240" width="240" height="84" rx="8" fill="#f5f5f5"/>
      <rect x="260" y="240" width="240" height="84" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="268" y="248" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="284" y="257" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LIVE</text>
      <text x="380" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đang hoạt động</text>
      <text x="380" y="310" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">TTL ≤ 900s</text>

      <!-- Không được cấp -->
      <rect x="820" y="240" width="240" height="84" rx="8" fill="#f5f5f5"/>
      <rect x="820" y="240" width="240" height="84" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="828" y="248" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="844" y="257" fill="rgba(45,49,66,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SKIP</text>
      <text x="940" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không được cấp</text>
      <text x="940" y="310" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cooldown · hạn mức IP · email lạ</text>

      <!-- Hết hiệu lực -->
      <rect x="180" y="440" width="200" height="84" rx="8" fill="#f5f5f5"/>
      <rect x="180" y="440" width="200" height="84" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="188" y="448" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="206" y="457" fill="rgba(79,93,117,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GONE</text>
      <text x="280" y="492" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hết hiệu lực</text>
      <text x="280" y="510" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">key đã biến mất</text>

      <!-- Đã tiêu thụ (tiêu điểm) -->
      <rect x="600" y="440" width="200" height="84" rx="8" fill="#f5f5f5"/>
      <rect x="600" y="440" width="200" height="84" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="608" y="448" width="36" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="626" y="457" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DONE</text>
      <text x="700" y="492" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đã tiêu thụ</text>
      <text x="700" y="510" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mật khẩu đã đổi</text>

      <!-- Kết thúc 1 -->
      <circle cx="700" cy="604" r="8" fill="none" stroke="#2d3142" stroke-width="1"/>
      <circle cx="700" cy="604" r="5" fill="#2d3142"/>

      <!-- Kết thúc 2 -->
      <circle cx="940" cy="396" r="8" fill="none" stroke="#2d3142" stroke-width="1"/>
      <circle cx="940" cy="396" r="5" fill="#2d3142"/>

      <!-- ===================== EDITORIAL ASIDE ===================== -->
      <text x="80" y="664" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Mọi lần đặt lại mật khẩu bằng token không còn trong Redis — hết hạn, bị thay thế, hay đã dùng rồi — đều nhận đúng một lỗi 400; còn GET validate chỉ trả valid: false.</text>

      <!-- ===================== LEGEND ===================== -->
      <line x1="80" y1="700" x2="1220" y2="700" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="80" y="720" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <circle cx="176" cy="716" r="6" fill="#2d3142"/>
      <text x="192" y="720" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">BẮT ĐẦU</text>

      <circle cx="304" cy="716" r="8" fill="none" stroke="#2d3142" stroke-width="1"/>
      <circle cx="304" cy="716" r="5" fill="#2d3142"/>
      <text x="320" y="720" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">KẾT THÚC</text>

      <rect x="448" y="708" width="20" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="476" y="720" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">LỐI RA ĐỔI ĐƯỢC MẬT KHẨU</text>

      <line x1="736" y1="716" x2="776" y2="716" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
      <text x="784" y="720" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">CHỈ ĐỌC, KHÔNG TIÊU THỤ</text>
    </svg>
  </div>
</body>
</html>
