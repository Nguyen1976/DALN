<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DALN · Message pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data flow · Fan-in queue · DALN</p>
    <h1>How one chat instance absorbs 3,500 messages a second</h1>

    <svg viewBox="0 0 960 624" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="daln-message-pipeline-title daln-message-pipeline-desc">
      <title id="daln-message-pipeline-title">DALN message write pipeline</title>
      <desc id="daln-message-pipeline-desc">Data flow showing many client sockets fanning into the realtime gateway, which queues messages in RabbitMQ; the chat consumer checks membership and hands each message to a batch writer that stores up to 100 messages in one MongoDB createMany, then fans the result back out while unread counters flush from Redis every 5 seconds.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Editorial aside (top) -->
      <text x="40" y="64" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">k6 ramp to 3,500 msg/s on a single chat instance: p95 115 ms.</text>

      <!-- ============ ARROWS (behind nodes) ============ -->
      <!-- Fan-in: many sockets into the gateway, one attach point each -->
      <line x1="144" y1="212" x2="200" y2="212" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="144" y1="244" x2="200" y2="244" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="144" y1="276" x2="200" y2="276" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- Main path -->
      <line x1="328" y1="244" x2="376" y2="244" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="552" y1="244" x2="600" y2="244" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="736" y1="244" x2="784" y2="244" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Focal write: one createMany per batch -->
      <line x1="852" y1="292" x2="852" y2="448" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Rejected outcome: a failed batch becomes an error event for the sender -->
      <line x1="668" y1="204" x2="668" y2="136" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Admitted outcome: message.sent fans back out through the gateway -->
      <path d="M 624,284 V 416 Q 624,424 616,424 H 272 Q 264,424 264,416 V 316" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Unread counters: Redis now, MongoDB later -->
      <line x1="696" y1="284" x2="696" y2="472" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="728" y1="500" x2="792" y2="500" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Arrow labels (masked, 8px from the stroke) -->
      <rect x="332" y="224" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="352" y="233" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PUBLISH</text>

      <rect x="556" y="224" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="576" y="233" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONSUME</text>

      <rect x="740" y="224" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="760" y="233" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENQUEUE</text>

      <rect x="772" y="380" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="808" y="389" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CREATEMANY</text>

      <rect x="612" y="164" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="636" y="173" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ON FAIL</text>

      <rect x="380" y="404" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="440" y="413" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MESSAGE.SENT → ROOM</text>

      <rect x="704" y="340" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="732" y="349" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UNREAD +1</text>

      <rect x="732" y="480" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="760" y="489" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVERY 5 S</text>

      <!-- ============ NODES ============ -->
      <!-- Clients (cohort) -->
      <rect x="40" y="192" width="104" height="104" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="192" width="104" height="104" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="200" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="62" y="209" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SPA</text>
      <text x="92" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Clients</text>
      <text x="92" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">N sockets</text>
      <text x="92" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Socket.IO</text>

      <!-- Realtime gateway -->
      <rect x="200" y="172" width="128" height="144" rx="6" fill="#f5f5f5"/>
      <rect x="200" y="172" width="128" height="144" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="208" y="180" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="222" y="189" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WS</text>
      <text x="264" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Realtime gateway</text>
      <text x="264" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">socket event</text>
      <text x="264" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ RabbitMQ</text>

      <!-- RabbitMQ queue (store) with visible slots + in-flight capacity -->
      <rect x="376" y="164" width="176" height="176" rx="6" fill="#f5f5f5"/>
      <rect x="376" y="164" width="176" height="176" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="384" y="172" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="402" y="181" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">QUEUE</text>
      <text x="464" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RabbitMQ queue</text>
      <text x="464" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chat_queue_send_message</text>

      <rect x="388" y="232" width="104" height="16" rx="2" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="396" y="243" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">msg 1041</text>
      <rect x="388" y="252" width="104" height="16" rx="2" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="396" y="263" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">msg 1042</text>
      <rect x="388" y="272" width="104" height="16" rx="2" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="396" y="283" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">msg 1043</text>
      <rect x="388" y="292" width="104" height="16" rx="2" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="396" y="303" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">msg 1044</text>
      <rect x="388" y="312" width="104" height="16" rx="2" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="396" y="323" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">msg 1045 …</text>

      <rect x="500" y="232" width="44" height="96" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="522" y="280" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">300</text>
      <text x="522" y="296" fill="#4f5d75" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">PREFETCH</text>

      <!-- Chat consumer -->
      <rect x="600" y="204" width="136" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="204" width="136" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="608" y="212" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="622" y="221" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="668" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chat consumer</text>
      <text x="668" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">member check · Redis</text>
      <text x="668" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">attachment check</text>

      <!-- Batch writer (focal) -->
      <rect x="784" y="196" width="136" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="784" y="196" width="136" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="792" y="204" width="36" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="810" y="213" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BATCH</text>
      <text x="852" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Batch writer</text>
      <text x="852" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">flush at 100 msgs</text>
      <text x="852" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">or every 20 ms</text>

      <!-- Error to sender (optional / failure path) -->
      <rect x="600" y="88" width="136" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="88" width="136" height="48" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="668" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Error to sender</text>
      <text x="668" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">message:error</text>

      <!-- MongoDB (store) -->
      <rect x="792" y="448" width="120" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="792" y="448" width="120" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="800" y="456" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="814" y="465" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="852" y="488" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MongoDB</text>
      <text x="852" y="504" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chat-service</text>

      <!-- Redis (store) -->
      <rect x="592" y="472" width="136" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="592" y="472" width="136" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="600" y="480" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="618" y="489" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CACHE</text>
      <text x="660" y="500" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Redis</text>
      <text x="660" y="516" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">unread · dirty set</text>

      <!-- Editorial aside (bottom) -->
      <text x="40" y="540" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">One createMany per batch costs ~139× less CPU per message than inserting one by one.</text>

      <!-- ============ LEGEND ============ -->
      <line x1="40" y1="564" x2="920" y2="564" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="580" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="592" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="600" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Bottleneck, amortised</text>

      <rect x="164" y="592" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="184" y="600" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Service</text>

      <rect x="236" y="592" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="256" y="600" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Queue / store</text>

      <rect x="332" y="592" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="352" y="600" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Failure path</text>

      <line x1="436" y1="597" x2="464" y2="597" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="472" y="600" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Socket event</text>

      <line x1="556" y1="597" x2="584" y2="597" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="592" y="600" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Message flow</text>

      <line x1="676" y1="597" x2="704" y2="597" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="712" y="600" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Batched write</text>

      <line x1="800" y1="597" x2="828" y2="597" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="836" y="600" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Async / periodic</text>
    </svg>
  </div>
</body>
</html>
