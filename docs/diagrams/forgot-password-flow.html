<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luồng quên mật khẩu — DALN</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142;
      --color-muted: #4f5d75; --color-accent: #eb6c36;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · DALN</p>
    <h1>Quên mật khẩu — từ cú bấm đến mật khẩu mới</h1>

    <svg viewBox="0 0 1280 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fp-flow-title fp-flow-desc">
      <title id="fp-flow-title">Luồng quên mật khẩu của DALN Chat</title>
      <desc id="fp-flow-desc">Sequence diagram cho luồng đặt lại mật khẩu: trình duyệt gọi forgot-password, user-service kiểm tra hạn mức rồi lưu hash token vào Redis với TTL 15 phút và phát sự kiện lên RabbitMQ, đồng thời trả 204 bất kể email có tồn tại hay không; notification-service nhận sự kiện và gửi email chứa liên kết; người dùng bấm liên kết, trình duyệt kiểm tra token rồi gửi mật khẩu mới, user-service tiêu thụ token và trả 204.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===================== LIFELINES ===================== -->
      <line x1="160"  y1="108" x2="160"  y2="780" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="420"  y1="108" x2="420"  y2="780" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="680"  y1="108" x2="680"  y2="780" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="920"  y1="108" x2="920"  y2="780" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="1140" y1="108" x2="1140" y2="780" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ===================== MESSAGES (vẽ trước boxes) ===================== -->

      <!-- 1. POST /forgot-password -->
      <line x1="160" y1="168" x2="416" y2="168" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
      <rect x="236" y="148" width="108" height="12" rx="2" fill="#f5f5f5"/>
      <text x="290" y="157" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /forgot-password</text>

      <!-- 2. rate limit -->
      <line x1="424" y1="216" x2="676" y2="216" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="492" y="196" width="116" height="12" rx="2" fill="#f5f5f5"/>
      <text x="550" y="205" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INCR ip · SET NX 60s</text>

      <!-- 3. lưu token -->
      <line x1="424" y1="264" x2="676" y2="264" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="488" y="244" width="124" height="12" rx="2" fill="#f5f5f5"/>
      <text x="550" y="253" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SET sha256 · EX 900</text>

      <!-- 4. publish (async) -->
      <line x1="424" y1="312" x2="916" y2="312" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="756" y="292" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="800" y="301" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">user.passwordReset</text>

      <!-- 5. 204 (return) -->
      <line x1="416" y1="360" x2="160" y2="360" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="248" y="340" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="290" y="349" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">204 · LUÔN LUÔN</text>

      <!-- 6. consume (async) -->
      <line x1="924" y1="408" x2="1136" y2="408" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="996" y="388" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1030" y="397" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONSUME</text>

      <!-- 7. EMAIL — ngoài luồng (coral) -->
      <line x1="1136" y1="468" x2="160" y2="468" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <rect x="740" y="444" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="800" y="453" fill="#eb6c36" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EMAIL · LINK 15 PHÚT</text>

      <!-- 8. GET validate -->
      <line x1="160" y1="532" x2="416" y2="532" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
      <rect x="240" y="512" width="100" height="12" rx="2" fill="#f5f5f5"/>
      <text x="290" y="521" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET validate?token</text>

      <!-- 9. valid + maskedEmail (return) -->
      <line x1="416" y1="580" x2="160" y2="580" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="240" y="560" width="100" height="12" rx="2" fill="#f5f5f5"/>
      <text x="290" y="569" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">valid · maskedEmail</text>

      <!-- 10. POST /reset-password -->
      <line x1="160" y1="628" x2="416" y2="628" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
      <rect x="236" y="608" width="108" height="12" rx="2" fill="#f5f5f5"/>
      <text x="290" y="617" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /reset-password</text>

      <!-- 11. tiêu thụ token -->
      <line x1="424" y1="676" x2="676" y2="676" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="508" y="656" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="550" y="665" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GETDEL TOKEN</text>

      <!-- 12. 204 thành công (coral, headline) -->
      <line x1="416" y1="724" x2="160" y2="724" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="244" y="704" width="92" height="12" rx="2" fill="#f5f5f5"/>
      <text x="290" y="713" fill="#eb6c36" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">204 · ĐÃ ĐỔI</text>

      <!-- ===================== ACTIVATION BARS ===================== -->
      <rect x="416" y="168" width="8" height="192" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="416" y="532" width="8" height="48"  fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="416" y="628" width="8" height="96"  fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="676" y="216" width="8" height="16"  fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="676" y="264" width="8" height="16"  fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="676" y="676" width="8" height="16"  fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="916" y="312" width="8" height="96"  fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="1136" y="408" width="8" height="60" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- ===================== ACTORS ===================== -->
      <!-- Trình duyệt -->
      <rect x="80" y="56" width="160" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="56" width="160" height="52" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="88" y="62" width="32" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="104" y="71" fill="rgba(122,131,153,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="160" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trình duyệt</text>

      <!-- user-service -->
      <rect x="340" y="56" width="160" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="56" width="160" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="348" y="62" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="362" y="71" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="420" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">user-service</text>

      <!-- Redis -->
      <rect x="600" y="56" width="160" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="56" width="160" height="52" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="608" y="62" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="628" y="71" fill="rgba(79,93,117,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="680" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Redis</text>

      <!-- RabbitMQ -->
      <rect x="840" y="56" width="160" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="840" y="56" width="160" height="52" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="848" y="62" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="862" y="71" fill="rgba(45,49,66,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BUS</text>
      <text x="920" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RabbitMQ</text>

      <!-- notification-service -->
      <rect x="1060" y="56" width="160" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="1060" y="56" width="160" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="1068" y="62" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="1084" y="71" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MAIL</text>
      <text x="1140" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">notification</text>

      <!-- ===================== EDITORIAL ASIDE ===================== -->
      <text x="80" y="820" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Chuỗi đứt ở mũi tên cam: hệ thống buông tay tại hộp thư, và chỉ nối lại nếu đúng người đó mở email.</text>

      <!-- ===================== LEGEND ===================== -->
      <line x1="80" y1="848" x2="1220" y2="848" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="80" y="868" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="168" y1="864" x2="208" y2="864" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
      <text x="216" y="868" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">GỌI HTTP</text>

      <line x1="332" y1="864" x2="372" y2="864" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="380" y="868" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">PHẢN HỒI</text>

      <line x1="496" y1="864" x2="536" y2="864" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <text x="544" y="868" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">BẤT ĐỒNG BỘ (RMQ)</text>

      <line x1="744" y1="864" x2="784" y2="864" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="792" y="868" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">TIÊU ĐIỂM</text>
    </svg>
  </div>
</body>
</html>
