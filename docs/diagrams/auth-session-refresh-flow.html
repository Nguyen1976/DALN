<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Làm mới token có rotation · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Noto Serif', 'Instrument Serif', Georgia, serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1100px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 840px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · DALN · Auth v2</p>
    <h1>Làm mới token — mỗi lần dùng là một lần đổi</h1>

    <svg viewBox="0 0 960 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="refresh-flow-title refresh-flow-desc">
      <title id="refresh-flow-title">Làm mới token có rotation</title>
      <desc id="refresh-flow-desc">Một request bị 401 vì access token hết hạn, trình duyệt gọi endpoint refresh riêng, user-service đối chiếu hash refresh token trong Redis rồi cấp cặp cookie mới và giữ hash cũ trong 30 giây ân hạn, sau đó các request đang xếp hàng được retry.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ================================================================
           LIFELINES — Browser 120 · chat-svc 360 · user-svc 600 · Redis 840
           ================================================================ -->
      <line x1="120" y1="128" x2="120" y2="568" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="360" y1="128" x2="360" y2="568" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="600" y1="128" x2="600" y2="568" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="840" y1="128" x2="840" y2="568" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ================================================================
           ACTIVATION BARS
           ================================================================ -->
      <rect x="116" y="168" width="8" height="56" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="356" y="168" width="8" height="56" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="116" y="264" width="8" height="272" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="596" y="264" width="8" height="184" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="836" y="304" width="8" height="96" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="356" y="480" width="8" height="56" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- M1 · Browser → chat-svc — request bình thường -->
      <line x1="124" y1="176" x2="356" y2="176" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="182" y="156" width="116" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="165" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GET /CONVERSATIONS</text>

      <!-- M2 · chat-svc → Browser — access đã hết hạn -->
      <line x1="356" y1="216" x2="124" y2="216" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="180" y="196" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="205" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">401 ACCESS_EXPIRED</text>

      <!-- M3 · Browser → user-svc — endpoint refresh riêng -->
      <line x1="124" y1="272" x2="596" y2="272" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="422" y="252" width="116" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="261" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST /USER/REFRESH</text>

      <!-- M4 · user-svc → Redis — đối chiếu hash -->
      <line x1="604" y1="312" x2="836" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="670" y="292" width="100" height="12" rx="2" fill="#f5f5f5"/>
      <text x="720" y="301" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HGET SESS:&lt;SID&gt;</text>

      <!-- M5 · Redis → user-svc -->
      <line x1="836" y1="352" x2="604" y2="352" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="688" y="332" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="720" y="341" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RTHASH OK</text>

      <!-- M6 · user-svc → Redis — rotate + giữ prevHash -->
      <line x1="604" y1="392" x2="836" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="661" y="372" width="118" height="12" rx="2" fill="#f5f5f5"/>
      <text x="720" y="381" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROTATE · PREV +30S</text>

      <!-- M7 · user-svc → Browser — HEADLINE -->
      <line x1="596" y1="440" x2="124" y2="440" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="178" y="420" width="124" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="429" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">200 · SET-COOKIE ×2</text>

      <!-- M8 · Browser → chat-svc — retry các request đã xếp hàng -->
      <line x1="124" y1="488" x2="356" y2="488" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="198" y="468" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="477" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RETRY QUEUED</text>

      <!-- M9 · chat-svc → Browser -->
      <line x1="356" y1="528" x2="124" y2="528" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="204" y="508" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="517" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">200 · BODY</text>

      <!-- ================================================================
           ACTORS
           ================================================================ -->
      <rect x="48" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="56" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="72" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SPA</text>
      <text x="120" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trình duyệt</text>
      <text x="120" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">interceptor</text>

      <rect x="288" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="296" y="80" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="316" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GUARD</text>
      <text x="360" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">chat-service</text>
      <text x="360" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">verify JWT</text>

      <rect x="528" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="528" y="72" width="144" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="536" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="552" y="89" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="600" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">user-service</text>
      <text x="600" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/user/refresh</text>

      <rect x="768" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="768" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="776" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="790" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KV</text>
      <text x="840" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Redis</text>
      <text x="840" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rtHash · prevHash</text>

      <!-- ================================================================
           HAI CHI TIẾT KHIẾN ROTATION KHÔNG LÀM HỎNG TRẢI NGHIỆM
           ================================================================ -->
      <rect x="48" y="592" width="416" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="56" y="600" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="70" y="609" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FE</text>
      <text x="56" y="632" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Single-flight ở frontend</text>
      <text x="56" y="648" fill="#4f5d75" font-size="9.5" font-family="'Geist', sans-serif">Bao nhiêu request nhận 401 cũng chỉ gọi refresh</text>
      <text x="56" y="662" fill="#4f5d75" font-size="9.5" font-family="'Geist', sans-serif">một lần; số còn lại xếp hàng chờ rồi tự retry.</text>

      <rect x="496" y="592" width="416" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="504" y="600" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="518" y="609" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BE</text>
      <text x="504" y="632" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Cửa sổ ân hạn 30 giây</text>
      <text x="504" y="648" fill="#4f5d75" font-size="9.5" font-family="'Geist', sans-serif">prevHash vẫn được nhận trong 30s, nên hai tab</text>
      <text x="504" y="662" fill="#4f5d75" font-size="9.5" font-family="'Geist', sans-serif">refresh cùng lúc không bị hiểu là token bị trộm.</text>

      <!-- ================================================================
           LEGEND
           ================================================================ -->
      <line x1="48" y1="704" x2="912" y2="704" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="48" y="720" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <line x1="48" y1="736" x2="76" y2="736" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="84" y="740" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Gọi HTTP</text>

      <line x1="208" y1="736" x2="236" y2="736" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="244" y="740" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Gọi nội bộ</text>

      <line x1="368" y1="736" x2="396" y2="736" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="404" y="740" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Trả về</text>

      <line x1="528" y1="736" x2="556" y2="736" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="564" y="740" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Kết quả chính</text>

      <rect x="688" y="730" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="708" y="740" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Nơi giữ state</text>
    </svg>
  </div>
</body>
</html>
