<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DALN · Audio and video calls</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Calls · DALN</p>
    <h1>Signaling through the gateway, media peer to peer</h1>

    <svg viewBox="0 0 960 564" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="daln-call-flow-title daln-call-flow-desc">
      <title id="daln-call-flow-title">DALN audio and video calls</title>
      <desc id="daln-call-flow-desc">Two browsers exchange call signaling through the realtime gateway over Socket.IO, which keeps call sessions and busy locks in Redis and checks membership and logs calls with the chat service; 1-1 audio and video then flow directly peer to peer, or through the coturn relay when NAT blocks the direct path, while group calls send media through a LiveKit SFU.</desc>
      <defs>
        <marker id="cf-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="cf-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="cf-arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
          <polygon points="0 0, 8 3, 0 6" fill="#2d3142"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Connectors (drawn before nodes) ===== -->

      <!-- Signaling: A <-> gateway <-> B -->
      <line x1="200" y1="192" x2="320" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#cf-arrow)" marker-end="url(#cf-arrow)"/>
      <line x1="640" y1="192" x2="760" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#cf-arrow)" marker-end="url(#cf-arrow)"/>

      <!-- Gateway -> Redis, gateway -> chat -->
      <line x1="392" y1="152" x2="392" y2="104" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cf-arrow)"/>
      <line x1="568" y1="152" x2="568" y2="104" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cf-arrow)"/>

      <!-- Media 1-1: direct P2P (focal) -->
      <line x1="200" y1="288" x2="760" y2="288" stroke="#eb6c36" stroke-width="1.6" marker-start="url(#cf-arrow-accent)" marker-end="url(#cf-arrow-accent)"/>

      <!-- Media 1-1: relay through coturn when NAT blocks -->
      <line x1="200" y1="352" x2="400" y2="352" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="4,3" marker-start="url(#cf-arrow-ink)" marker-end="url(#cf-arrow-ink)"/>
      <line x1="560" y1="352" x2="760" y2="352" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="4,3" marker-start="url(#cf-arrow-ink)" marker-end="url(#cf-arrow-ink)"/>

      <!-- Media group: through LiveKit SFU -->
      <line x1="200" y1="448" x2="400" y2="448" stroke="#2d3142" stroke-width="1.2" marker-start="url(#cf-arrow-ink)" marker-end="url(#cf-arrow-ink)"/>
      <line x1="560" y1="448" x2="760" y2="448" stroke="#2d3142" stroke-width="1.2" marker-start="url(#cf-arrow-ink)" marker-end="url(#cf-arrow-ink)"/>

      <!-- ===== Arrow labels (masked, 8px above the stroke) ===== -->
      <g font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" fill="#7a8399">
        <rect x="228" y="172" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="260" y="181" text-anchor="middle">OFFER · ICE</text>

        <rect x="664" y="172" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="700" y="181" text-anchor="middle">ANSWER · ICE</text>

        <rect x="576" y="120" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="580" y="129" text-anchor="start">HTTP · RMQ</text>

        <rect x="444" y="268" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="480" y="277" text-anchor="middle" fill="#eb6c36">DIRECT · 1-1</text>

        <rect x="264" y="332" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="300" y="341" text-anchor="middle">IF NAT BLOCKS</text>

        <rect x="268" y="428" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="300" y="437" text-anchor="middle">GROUP · SFU</text>
      </g>

      <!-- ===== Nodes ===== -->

      <!-- Browser A (input/user) -->
      <rect x="40" y="152" width="160" height="328" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="152" width="160" height="328" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="158" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="62" y="167" fill="rgba(122,131,153,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
      <text x="120" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Browser A</text>
      <text x="120" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">useWebRTC</text>
      <text x="120" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">useGroupCall</text>

      <!-- Browser B (input/user) -->
      <rect x="760" y="152" width="160" height="328" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="152" width="160" height="328" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="768" y="158" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="782" y="167" fill="rgba(122,131,153,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
      <text x="840" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Browser B</text>
      <text x="840" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">useWebRTC</text>
      <text x="840" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">useGroupCall</text>

      <!-- realtime-gateway (focal) -->
      <rect x="320" y="152" width="320" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="152" width="320" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="328" y="158" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="342" y="167" fill="rgba(235,108,54,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WS</text>
      <text x="480" y="192" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">realtime-gateway</text>
      <text x="480" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Socket.IO · call.* · group_call.*</text>

      <!-- Redis (store) -->
      <rect x="320" y="40" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="40" width="144" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="328" y="46" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="342" y="55" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KV</text>
      <text x="392" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Redis</text>
      <text x="392" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">session · busy lock</text>

      <!-- chat service (backend) -->
      <rect x="496" y="40" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="496" y="40" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="504" y="46" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="518" y="55" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
      <text x="568" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">chat service</text>
      <text x="568" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">members · call log</text>

      <!-- coturn (external) -->
      <rect x="400" y="320" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="320" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="408" y="326" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>
      <text x="422" y="335" fill="rgba(45,49,66,0.6)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TURN</text>
      <text x="480" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">coturn</text>
      <text x="480" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">:3478 · :5349</text>

      <!-- LiveKit SFU (external) -->
      <rect x="400" y="416" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="416" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="408" y="422" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>
      <text x="422" y="431" fill="rgba(45,49,66,0.6)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SFU</text>
      <text x="480" y="452" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LiveKit</text>
      <text x="480" y="468" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">wss · RTC</text>

      <!-- ===== Legend (bottom strip) ===== -->
      <line x1="40" y1="512" x2="920" y2="512" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <g font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75" letter-spacing="0.14em">
        <text x="40" y="540">LEGEND</text>

        <line x1="120" y1="536" x2="144" y2="536" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="152" y="540">SIGNALING</text>

        <line x1="296" y1="536" x2="320" y2="536" stroke="#eb6c36" stroke-width="1.6"/>
        <text x="328" y="540">MEDIA · DIRECT</text>

        <line x1="496" y1="536" x2="520" y2="536" stroke="#2d3142" stroke-width="1.2"/>
        <text x="528" y="540">MEDIA · VIA SERVER</text>

        <line x1="716" y1="536" x2="740" y2="536" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="4,3"/>
        <text x="748" y="540">RELAY FALLBACK</text>
      </g>
    </svg>
  </div>
</body>
</html>
